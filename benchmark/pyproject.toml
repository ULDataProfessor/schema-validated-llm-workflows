[project]
name = "type-safe-agentic-ai-benchmark"
version = "0.1.0"
description = "Empirical benchmark comparing PydanticAI and alternative agent frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pydantic_ai = ["pydantic-ai>=0.1"]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.2"]
dspy = ["dspy>=2.5"]
crewai = ["crewai>=0.80"]
agno = ["agno>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]
all = [
    "type-safe-agentic-ai-benchmark[pydantic_ai,langgraph,dspy,crewai,agno,dev]",
]

[project.scripts]
tsai-benchmark = "scripts.run_benchmark:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "eval*", "frameworks*", "tasks*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
